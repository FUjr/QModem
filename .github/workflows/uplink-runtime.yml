name: Uplink runtime regression
on:
  push:
    paths: ['application/qmodem_uplink_manager/**', 'application/qmodem/**', 'application/modem_scan/**', 'application/quectel_CM_5G_M/**', 'luci/luci-app-qmodem-uplink/**', '.github/workflows/uplink-runtime.yml']
  pull_request:
    paths: ['application/qmodem_uplink_manager/**', 'application/qmodem/**', 'application/modem_scan/**', 'application/quectel_CM_5G_M/**', 'luci/luci-app-qmodem-uplink/**', '.github/workflows/uplink-runtime.yml']
jobs:
  packets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 conntrack jq libjson-c-dev
      - name: Check syntax and lifecycle tests
        run: |
          while IFS= read -r -d '' file; do
            if head -1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; fi
          done < <(find application/qmodem_uplink_manager/root -type f -print0)
          node --check luci/luci-app-qmodem-uplink/htdocs/luci-static/resources/view/qmodem/uplink.js
          sh application/qmodem_uplink_manager/tests/test_health.sh
          sh application/qmodem/tests/test_bridge_passthrough.sh
          cc -pthread application/modem_scan/tests/test_scheduler.c -ljson-c -o /tmp/test-scheduler
          /tmp/test-scheduler
          cc -pthread application/quectel_CM_5G_M/tests/test_managed_ipv4.c -o /tmp/test-managed
          /tmp/test-managed
      - name: Exercise independent probes and real weighted NAT traffic
        run: |
          sudo sh application/qmodem_uplink_manager/tests/test_routes.sh
          sudo sh application/qmodem_uplink_manager/tests/test_balance.sh
